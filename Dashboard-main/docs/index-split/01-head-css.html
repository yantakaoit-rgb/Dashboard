<style>
:root{--ink:#0e2235;--teal:#0b7a8a;--tl:#14a3a8;--paper:#f2f6f9;--line:#dce6ee;--mut:#5d7186;--amber:#e9a23b;--coral:#e2563c;--green:#2f9e6b}
*{box-sizing:border-box;margin:0}
body{font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
header{background:linear-gradient(110deg,var(--ink) 40%,#0f4a5c);color:#fff;padding:18px clamp(14px,3vw,36px)}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;max-width:1480px;margin:auto}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:12px;background:#ffffff1c;display:grid;place-items:center;font-size:26px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
h1{font-size:clamp(18px,2.4vw,26px);font-weight:700;letter-spacing:.2px}header small{opacity:.7;font-size:12.5px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl button,.ctl input{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid #ffffff30;background:#ffffff14;color:#fff;cursor:pointer}

.ctl button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--amber)}

main{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;padding:18px clamp(14px,3vw,36px) 36px;max-width:1480px;margin:auto}
.s{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;grid-column:span 4;min-width:0}
.w12{grid-column:span 12}.w8{grid-column:span 8}.w6{grid-column:span 6}

.h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}.h b{background:var(--teal);color:#fff;border-radius:7px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;align-self:center}
.h h2{font-size:15px;font-weight:600}.h span{color:var(--mut);font-size:12px;margin-left:auto}
.hero{display:grid;grid-template-columns:230px 1fr;gap:18px}@media(max-width:800px){.hero{grid-template-columns:1fr}}
.gauge{background:var(--ink);color:#fff;border-radius:12px;padding:16px;text-align:center}.gauge small{opacity:.7;display:block}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.k{border:1px solid var(--line);border-radius:10px;padding:12px;position:relative}
.k i{font-style:normal;color:var(--mut);font-size:12px}.k strong{display:block;font-size:26px;font-weight:700;line-height:1.2;margin:2px 0}
.k u{text-decoration:none;color:var(--mut);font-size:12px;margin-left:4px;font-weight:400}.k em{font-style:normal;font-size:11.5px;font-weight:500}
.k svg{display:block;margin-top:6px}.up{color:var(--green)}.dn{color:var(--coral)}
.bar{display:grid;grid-template-columns:minmax(80px,130px) 1fr 70px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bar div{background:#eaf0f5;border-radius:99px;height:10px;overflow:hidden}.bar u{display:block;height:100%;border-radius:99px}.bar span:last-child{text-align:right;font-weight:600}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}tr:last-child td{border:0}
.chip{padding:3px 11px;border-radius:99px;color:#fff;font-size:12px;font-weight:500}.ok{background:var(--green)}.bad{background:var(--coral)}
.al td:first-child{border-left:4px solid var(--green);padding-left:12px}.al tr.b td:first-child{border-color:var(--coral)}
.nd{color:var(--mut);text-align:center;padding:14px;font-size:13px}
svg{touch-action:pan-y}.hit{fill:transparent;cursor:crosshair}.hit:hover,.hit.on{fill:rgba(11,122,138,.10)}
.rb{max-width:1480px;margin:14px auto 0;padding:0 clamp(14px,3vw,36px)}.rb:empty{display:none}
.rb>div{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px}
.rb b{font-size:14px}.rb .pill{background:#e6f4f6;color:var(--teal);border-radius:99px;padding:2px 11px;font-size:12px;font-weight:600}.rb span{color:var(--mut)}
.dn2{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dn2>svg{flex:none;overflow:visible}
.dl{flex:1;min-width:150px;display:grid;gap:2px}
.dl>div{display:grid;grid-template-columns:12px 1fr auto auto;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px;cursor:default}
.dl>div:hover,.dl>div.on{background:#f2f6f9}.dl i{width:12px;height:12px;border-radius:4px}
.dl em{font-style:normal;color:var(--mut);font-size:12px;min-width:44px;text-align:right}.dl b{font-weight:600}
.dsg{transition:opacity .15s,stroke-width .15s;cursor:pointer}.dsg:hover{stroke-width:7.4}
.gauge .dl>div:hover{background:#ffffff14}
@keyframes dsw{from{stroke-dasharray:0 100}}
.dsg{animation:dsw .7s ease-out both}
@media(prefers-reduced-motion:reduce){.dsg{animation:none}}
#tip{position:fixed;z-index:60;display:none;pointer-events:none;background:#0e2235;color:#fff;border-radius:10px;padding:10px 12px;font-size:12.5px;min-width:180px;max-width:290px;box-shadow:0 10px 28px #0e223566;line-height:1.4}
#tip .tr{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:5px}#tip .tr span{display:flex;align-items:center}

#tip .tt{border-top:1px solid #ffffff30;padding-top:5px}#tip small{display:block;margin-top:6px;opacity:.6;font-size:11px}

#v3 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#v3.tbh #vtop,#v3.tbh #vlist,#v3.tbh #vdet,#v3.tbh #vhint{display:none}
#vtg{position:absolute!important;right:14px!important;bottom:14px!important;z-index:99!important;font:inherit;font-size:15px!important;font-weight:700!important;padding:11px 18px!important;border-radius:999px!important;border:2px solid #fff!important;background:#0b7a8a!important;color:#fff!important;cursor:pointer;box-shadow:0 4px 16px #000a!important;opacity:1!important}#vtg:hover{background:#0e97a9!important}
#vz{bottom:72px!important;right:14px!important;z-index:99!important}#vz button{background:#0f2236!important;color:#fff!important;border:2px solid #fff!important;width:42px;height:42px;font-size:20px!important;font-weight:700;opacity:1!important;box-shadow:0 3px 10px #000a!important}#vz button:hover{background:#0b7a8a!important}
#v3 .p{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#vtop{top:10px;left:10px;right:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
#vkc{display:flex;gap:8px;flex-wrap:wrap}#vkc div{background:#ffffff0d;border-radius:9px;padding:4px 10px}#vkc i{font-style:normal;color:var(--mut);font-size:11px;display:block}#vkc b{font-size:16px}
#vtop .c3{display:flex;gap:6px;align-items:center}#vtop input,#vtop select,#vtop button,#vz button{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:#ffffff12;color:#e8f1f8;color-scheme:dark;cursor:pointer}
#vlist{left:10px;top:68px;width:190px;padding:6px;max-height:calc(100% - 130px);overflow:auto}
#vlist{transition:opacity .35s,transform .35s}#vlist.hid{opacity:0;transform:translateX(-14px);pointer-events:none}
#vlist button{display:flex;width:100%;gap:9px;align-items:center;text-align:left;font:inherit;font-size:13px;color:#e8f1f8;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer}
#vlist button:hover,#vlist button.on{background:#ffffff14}#vlist button i{width:9px;height:9px;border-radius:50%;flex:none}#vlist small{display:block;color:var(--mut);font-size:11px}
#vdet{right:10px;top:68px;width:270px;padding:14px;max-height:calc(100% - 130px);overflow:auto;font-size:13.5px}
#vdet h2{font-size:16px}#vdet .big{font-size:30px;font-weight:700;line-height:1.2}#vdet .chip{color:#06121f;font-weight:600}
#vdet table{width:100%;margin-top:10px;border-collapse:collapse}#vdet td{padding:5px 0;border-bottom:1px solid var(--line);text-align:left}#vdet td:last-child{text-align:right;font-weight:600}
#vhint{left:50%;bottom:10px;transform:translateX(-50%);padding:6px 14px;color:var(--mut);font-size:12px;white-space:nowrap}
#vmsg{left:50%;top:62px;transform:translateX(-50%);padding:4px 12px;color:#f5b441;font-size:12.5px}#vmsg:empty{display:none}
#vq{right:56px;bottom:10px;width:270px;padding:10px 12px;font-size:12px}
#vq .qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}#vq .qh b{font-size:12.5px}#vq .qh span{color:var(--mut)}
#vq .qb{display:flex;align-items:flex-end;gap:2px;height:46px}#vq .qb i{flex:1;background:#27c4cf66;border-radius:2px 2px 0 0;min-height:2px}#vq .qb i.on{background:#f5b441}#vq .qb i:hover{background:#27c4cf}
#vq .qa{display:flex;justify-content:space-between;color:var(--mut);font-size:10px;margin:2px 0 6px}
#vq .ql{display:grid;gap:2px;color:#cfe0ee}#vq .ql div{display:flex;justify-content:space-between;gap:8px}#vq .ql b{color:#fff}
#vq .lg2{display:flex;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:10.5px;margin-top:6px}#vq .lg2 i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
#vdet{max-height:calc(100% - 290px)}
#v3.tbh #vq{display:none!important}
@media(max-width:900px){#vq{display:none!important}}
.cltg{margin-left:10px;font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:0;background:var(--teal);color:#fff;cursor:pointer;white-space:nowrap;align-self:center}.cltg:hover{filter:brightness(1.1)}.cl3>*:not(.h){display:none!important}.cl3>.h{margin-bottom:0}
.fsx{position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:0!important;width:100%!important;height:100%!important;max-height:none!important;min-height:0!important;margin:0!important;border-radius:0!important;z-index:2147483000!important}html.fsx-lock{overflow:hidden!important}#vfs{font-weight:700}
#vz{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:6px}#vz input[type=range]{writing-mode:vertical-lr;direction:rtl;height:110px;width:22px;margin:0;accent-color:#27c4cf;cursor:pointer}#vz output{font-family:inherit;font-size:11px;font-weight:700;line-height:1;color:#fff;background:#0f2236;border:1px solid #fff6;border-radius:6px;padding:3px 5px;min-width:42px;text-align:center}#vz button.on{background:#0b7a8a!important}@media(max-width:900px){#vz #vzw{display:none}#vz input[type=range]{height:80px}}
@media(max-width:900px){#vlist{top:auto;bottom:46px;left:10px;right:10px;width:auto;display:flex;max-height:none;overflow-x:auto}#vlist button{min-width:120px}#vdet{top:auto;bottom:110px;left:10px;right:10px;width:auto;max-height:30%}#vhint{display:none}#vz{bottom:auto!important;top:70px}}
dialog{border:0;border-radius:14px;padding:22px;width:min(480px,92vw)}dialog label{display:block;margin:10px 0 3px;font-size:12px;color:var(--mut)}
dialog input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
dialog button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:var(--teal);color:#fff;cursor:pointer;margin:14px 6px 0 0}dialog button.g{background:#64748b}
/* ===== สไตล์ของการ์ดรายรับ แผนก/หอผู้ป่วย/สิทธิ ===== */
.tg{display:flex;gap:6px;align-items:center;flex-wrap:wrap} /* แถวปุ่ม: เรียงแนวนอน เว้นช่อง 6px ขึ้นบรรทัดใหม่ได้ */
.tg button{font:inherit;font-size:13px;padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer} /* ปุ่มปกติ: พื้นขาว ขอบเทา มุมมน */
.tg button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600} /* ปุ่มที่เลือกอยู่: พื้นเขียวน้ำเงิน ตัวขาวหนา */
.tg button:focus-visible{outline:2px solid var(--amber)} /* วงโฟกัสสีอำพันเมื่อใช้คีย์บอร์ด */
.tg span{margin-left:auto;color:var(--mut);font-size:12px} /* ข้อความหน่วยชิดขวา สีจาง */
@media(max-width:600px){#dpc .kp{grid-template-columns:1fr!important}} /* มือถือ: ช่องสรุปเรียงเป็นคอลัมน์เดียว */
#v3.tbh #vmsg{display:none!important} /* ซ่อนข้อความสถานะตอนซ่อนแถบเครื่องมือ */
</style>
<style id="reskin">

:root{--ink:#0b1f33;--teal:#0f8f96;--tl:#2dd4bf;--paper:#eef3f8;--line:#e2eaf2;--mut:#60758a;--amber:#f59e0b;--coral:#ef4444;--green:#16a37a;--r:22px;--sh:0 1px 2px #0b1f3310,0 12px 32px -12px #0b1f3322}

header{background:linear-gradient(115deg,#082b3a 0%,#0b6b78 55%,#1d6fe0 130%);padding:22px clamp(14px,3vw,36px) 30px;border-radius:0 0 28px 28px;box-shadow:0 18px 40px -22px #0b3a5a}

.ctl button,.ctl input{border-radius:999px;border-color:#ffffff38;background:#ffffff1a;backdrop-filter:blur(6px);transition:.15s}
.ctl button:hover{background:#ffffff33}.ctl button.on{background:#fff;color:#08323f;box-shadow:0 4px 14px #0003}
#snav{position:sticky;top:0;z-index:40;display:flex;gap:6px;overflow-x:auto;padding:10px clamp(14px,3vw,36px);margin:0 auto;max-width:1480px;scrollbar-width:none;backdrop-filter:blur(14px);background:#eef3f8cc}

#snav a:hover{color:var(--teal);border-color:var(--tl)}#snav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{gap:20px;padding-top:10px}
.s{border:1px solid #ffffffb0;border-radius:var(--r);box-shadow:var(--sh);padding:22px;background:#ffffffee;scroll-margin-top:64px}
.h{margin-bottom:18px}.h b{background:linear-gradient(135deg,var(--teal),#2563eb);border-radius:10px;min-width:28px;height:28px;font-size:13px;box-shadow:0 6px 14px -6px var(--teal)}

.rb>div{border-radius:16px;border-left-width:0;box-shadow:var(--sh);background:linear-gradient(90deg,#e6f7f7,#fff 60%)}

#sec1{background:linear-gradient(180deg,#fff,#f4f9fc)}
@media(max-width:600px){.s{padding:16px;border-radius:18px}header{border-radius:0 0 20px 20px}}
@media(prefers-reduced-motion:no-preference){.s{animation:rise .5s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}}

.now b{color:var(--ink);font-weight:600}.nd0{width:8px;height:8px;border-radius:50%;background:#16a37a;box-shadow:0 0 0 0 #16a37a88;animation:pls 1.6s infinite}

html{-webkit-text-size-adjust:100%}body{font-size:clamp(14px,.3vw + 12.8px,17px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding-top:max(22px,env(safe-area-inset-top,0px));padding-left:max(clamp(14px,3vw,36px),env(safe-area-inset-left,0px));padding-right:max(clamp(14px,3vw,36px),env(safe-area-inset-right,0px))}
img,svg{max-width:100%}.s{min-width:0}.tw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}.tw>table{min-width:520px}
@media(min-width:1700px){main,.top,#snav{max-width:1760px}body{font-size:17px}}
@media(max-width:1100px){main .gauge{min-width:0}}
@media(max-width:700px){
 header{padding-bottom:18px;border-radius:0 0 20px 20px}.top{gap:10px}
 .ctl{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.ctl::-webkit-scrollbar{display:none}.ctl>*{flex:none}
 main{gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 .s{padding:14px;border-radius:18px}.h{flex-wrap:wrap;gap:6px 10px}.h span{margin-left:auto}.h h2{font-size:16px}
 .hero,.dn2{grid-template-columns:1fr}.dn2{justify-content:center}
 #snav{padding:8px 12px}#snav a{padding:6px 12px}
 .dpw{max-height:480px}
}
@media(max-width:380px){main .k strong{letter-spacing:-.6px}.chips,.tg{gap:4px}}
@media(hover:none) and (pointer:coarse){.ctl button,.ctl input,#snav a,main .chip,.tg button,#vlist button,#vtop button,#vtop input,#vtop select{min-height:40px}}
@media(max-height:560px) and (orientation:landscape){#v3{min-height:0;height:calc(100svh - 24px)}}
@supports(height:100svh){#v3{height:min(94svh,1200px)}}
/* ===== ส่วนหัวคงที่ตอนเลื่อน ===== */
header{position:sticky;top:0;z-index:60;transition:padding .2s ease,box-shadow .2s ease}
header .logo,header h1,header .brand small{transition:all .2s ease}
header.stuck{padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;border-radius:0 0 18px 18px;box-shadow:0 10px 28px -12px #04202e99}
header.stuck .top{gap:8px 14px}header.stuck .logo{width:34px;height:34px;font-size:18px;border-radius:10px}header.stuck h1{font-size:15px}header.stuck .brand small{display:none}
#snav{top:var(--hh,0px);z-index:50}html{scroll-padding-top:calc(var(--hh,0px) + 56px)}.s{scroll-margin-top:calc(var(--hh,0px) + 64px)}
@media(max-width:700px){header.stuck .brand{display:none}header.stuck{padding-left:12px;padding-right:12px}}
#vtop select option{background:#12263a;color:#e8f1f8}
</style>
</head>
